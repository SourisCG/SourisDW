[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "souris-dw"
version = "0.1.0"
description = "Cross-platform music & video downloader for YouTube and Spotify"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "SourisDW" }]
keywords = ["youtube", "spotify", "downloader", "music", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/souris/souris-dw"
Repository = "https://github.com/souris/souris-dw"
Issues = "https://github.com/souris/souris-dw/issues"

[project.scripts]
souris-dw = "souris_dw:main"

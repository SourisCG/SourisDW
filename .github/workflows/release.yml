name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (defaults to the version in Cargo.toml, e.g. v0.4.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: musl is primary (works on ALL distros, including Fedora)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: souris-dw-linux-x86_64
            install_musl: true
          # Linux: glibc build also works on Fedora and other glibc distros
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: souris-dw-linux-x86_64-glibc
          # macOS: Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: souris-dw-macos-aarch64
          # Windows: x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: souris-dw-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.install_musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/souris-dw ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/souris-dw.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  package-linux:
    name: Package Linux (.deb/.rpm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-linux
      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build release binary
        run: cargo build --release
      - name: Build packages
        run: |
          cargo deb --no-build
          cargo generate-rpm
          mkdir packages
          cp target/debian/*.deb packages/
          cp target/generate-rpm/*.rpm packages/
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: packages/*

  release:
    name: Create Release
    needs: [build, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            case "$VERSION" in
              v*) ;;
              *) VERSION="v$VERSION" ;;
            esac
          else
            VERSION="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install packaging utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Create checksums
        run: |
          cd artifacts
          test -f souris-dw-linux-x86_64/souris-dw-linux-x86_64
          test -f souris-dw-linux-x86_64-glibc/souris-dw-linux-x86_64-glibc
          test -f souris-dw-macos-aarch64/souris-dw-macos-aarch64
          test -f souris-dw-windows-x86_64.exe/souris-dw-windows-x86_64.exe
          test -d linux-packages
          tar -C souris-dw-macos-aarch64 -czf souris-dw-macos-aarch64.tar.gz souris-dw-macos-aarch64
          zip -j souris-dw-windows-x86_64.zip souris-dw-windows-x86_64.exe/souris-dw-windows-x86_64.exe
          for dir in */; do
            cd "$dir"
            for file in *; do
              sha256sum "$file" >> ../checksums-sha256.txt
            done
            cd ..
          done
          for file in *.tar.gz *.zip linux-packages/*; do
            sha256sum "$file" >> checksums-sha256.txt
          done

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Publishing release $VERSION"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Choose another version or delete the existing release/tag."
            exit 1
          fi
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$VERSION" \
            $PRERELEASE_FLAG \
            --generate-notes \
            artifacts/souris-dw-linux-x86_64/souris-dw-linux-x86_64 \
            artifacts/souris-dw-linux-x86_64-glibc/souris-dw-linux-x86_64-glibc \
            artifacts/souris-dw-macos-aarch64/souris-dw-macos-aarch64 \
            artifacts/souris-dw-windows-x86_64.exe/souris-dw-windows-x86_64.exe \
            artifacts/souris-dw-macos-aarch64.tar.gz \
            artifacts/souris-dw-windows-x86_64.zip \
            artifacts/linux-packages/* \
            artifacts/checksums-sha256.txt

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux: musl is primary (works on ALL distros)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: souris-dw-linux-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: souris-dw-linux-x86_64-glibc
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact: souris-dw-linux-aarch64
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: souris-dw-linux-aarch64-glibc
            cross: true
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: souris-dw-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: souris-dw-macos-aarch64
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: souris-dw-windows-x86_64.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: souris-dw-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build with cross
        if: matrix.cross
        run: |
          cargo install cross --version 0.2.5
          cross build --release --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/souris-dw ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/souris-dw.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-fedora:
    name: Build (Fedora x86_64)
    runs-on: ubuntu-latest
    container: fedora:39
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git gcc curl gzip

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Rename artifact
        run: |
          cp target/x86_64-unknown-linux-gnu/release/souris-dw souris-dw-linux-x86_64-fedora
          chmod +x souris-dw-linux-x86_64-fedora

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: souris-dw-linux-x86_64-fedora
          path: souris-dw-linux-x86_64-fedora

  release:
    name: Create Release
    needs: [build, build-fedora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            for file in *; do
              sha256sum "$file" >> ../checksums-sha256.txt
            done
            cd ..
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/souris-dw-linux-x86_64/souris-dw-linux-x86_64
            artifacts/souris-dw-linux-x86_64-glibc/souris-dw-linux-x86_64-glibc
            artifacts/souris-dw-linux-x86_64-fedora/souris-dw-linux-x86_64-fedora
            artifacts/souris-dw-linux-aarch64/souris-dw-linux-aarch64
            artifacts/souris-dw-linux-aarch64-glibc/souris-dw-linux-aarch64-glibc
            artifacts/souris-dw-macos-x86_64/souris-dw-macos-x86_64
            artifacts/souris-dw-macos-aarch64/souris-dw-macos-aarch64
            artifacts/souris-dw-windows-x86_64.exe/souris-dw-windows-x86_64.exe
            artifacts/souris-dw-windows-arm64.exe/souris-dw-windows-arm64.exe
            artifacts/checksums-sha256.txt
